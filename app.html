<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#F4F0E8" />
<title>我的这一季 · App</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #F4F0E8; color: #1B1A17; height: 100%; }
  * { box-sizing: border-box; }
  div::-webkit-scrollbar { height: 0; width: 0; display: none; }
  div { scrollbar-width: none; -ms-overflow-style: none; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  body { -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
</style>
</head>
<body>
<div id="root">
  <div style="min-height:100vh;display:grid;place-items:center;padding:28px;background:#F4F0E8;color:#1B1A17;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
    <div style="max-width:440px;border:1px solid rgba(27,26,23,0.12);background:rgba(255,255,255,0.56);box-shadow:0 24px 60px rgba(27,26,23,0.10);padding:24px;">
      <div style="font:600 11px/1.2 'JetBrains Mono',monospace;letter-spacing:0;color:rgba(27,26,23,0.48);text-transform:uppercase;">S01·LIVE LOADING</div>
      <h1 style="margin:12px 0 10px;font:600 26px/1.2 'Noto Serif SC',serif;color:#1B1A17;">正在装载这一季</h1>
      <p style="margin:0 0 16px;font-size:14px;line-height:1.7;color:rgba(27,26,23,0.68);">如果这张卡停留太久，通常是 React、Babel 或网络资源还没有完成加载。</p>
      <code style="display:block;padding:12px 14px;border:1px solid rgba(27,26,23,0.12);background:rgba(244,240,232,0.78);font:600 13px/1.4 'JetBrains Mono',monospace;color:#1B1A17;">Season 2026 · Live app waiting</code>
      <p style="margin:14px 0 0;font-size:13px;line-height:1.6;color:rgba(27,26,23,0.58);">加载完成后，今天 / 本集 / 本季 会自动覆盖这张临时卡。</p>
    </div>
  </div>
</div>

<script>
(function () {
  if (location.protocol !== 'file:') return;
  const root = document.getElementById('root');
  if (root) root.innerHTML = '<div style="min-height:100vh;display:grid;place-items:center;background:#F4F0E8;font-family:-apple-system,sans-serif;"><div style="max-width:420px;padding:28px;"><h1 style="font:600 22px/1.3 \'Noto Serif SC\',serif;">请用本地 HTTP 服务器打开</h1><code style="display:block;margin-top:12px;padding:12px;border:1px solid rgba(27,26,23,0.12);font:600 13px/1.4 monospace;">python3 -m http.server 8765</code><p style="font-size:13px;color:rgba(27,26,23,0.6);">然后访问 http://localhost:8765/app.html</p></div></div>';
})();
</script>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="app/shared.jsx"></script>
<script type="text/babel" src="app/v2-mvp.jsx"></script>
<script src="app/store.js"></script>
<script type="text/babel" src="app/live.jsx"></script>

<script type="text/babel" data-presets="react">
if (location.protocol !== 'file:') {
  ReactDOM.createRoot(document.getElementById('root')).render(<LiveApp />);
}
</script>
</body>
</html>
